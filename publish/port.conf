# ======================================================================
#  PORT HTTP - PC System Resource Monitor (CPU, RAM, Disk, Network)
# ======================================================================
#  Isi file ini dengan SATU angka port (1 - 65535), contoh:
#
#      5055
#
#  Format lain yang juga diterima:
#      port=5055
#      port = 5070   # komentar di akhir baris diperbolehkan
#
#  Baris yang diawali tanda # , ; atau // dianggap komentar.
#
#  Bila file ini dihapus / kosong / isinya bukan angka yang valid /
#  port-nya sedang dipakai proses lain, aplikasi otomatis memakai
#  port default yang ditetapkan di kode C#:
#      PortConfiguration.DefaultPort = 5055
#  (lihat src\Services\PortConfiguration.cs)
#
#  Catatan:
#  - Setelah mengubah file ini, restart aplikasi agar port baru dipakai.
#  - File ini juga dibaca oleh Windows Service dan hasil publish
#    (letakkan port.conf di folder yang sama dengan PCMonitoringCPURam.exe).
#  - Saat hosting lewat IIS, port ditentukan oleh binding website IIS,
#    sehingga isi file ini tidak dipakai.
# ======================================================================
5055
